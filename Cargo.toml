[package]
name = "orb-billing"
authors = ["Materialize, Inc."]
readme = "README.md"
description = "An async API client for the Orb billing platform."
documentation = "https://docs.rs/orb"
license = "Apache-2.0"
categories = ["api-bindings", "web-programming"]
keywords = ["orb", "billing", "api", "sdk"]
repository = "https://github.com/MaterializeInc/rust-orb-billing"
version = "0.11.0"
rust-version = "1.75"
edition = "2021"

[dependencies]
async-stream = "0.3.6"
codes-iso-3166 = "0.1.5"
codes-iso-4217 = "0.1.7"
futures-core = "0.3.31"
futures-util = "0.3.31"
once_cell = "1.21.3"
ordered-float = { version = "5.0.0", features = ["serde"] }
rand = "0.9.1"
reqwest = { version = "0.12.15", features = ["json"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde-enum-str = "0.4.0"
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["serde", "serde-human-readable"] }
tokio = { version = "1.45.1" }
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[dev-dependencies]
futures = "0.3.31"
test-log = { version = "0.2.17", default-features = false, features = ["trace"] }
tokio = { version = "1.45.1", features = ["macros"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
